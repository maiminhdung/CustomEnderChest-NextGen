plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id("com.gradleup.shadow") version "9.6.1"
}

group = 'org.maiminhdung'
version = '2.1.3-dev'

repositories {
    mavenCentral()
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }

    maven {
        name = "faststats"
        url = "https://repo.faststats.dev/releases"
    }
    maven {
        name = "CodeMC"
        url = uri("https://repo.codemc.io/repository/maven-public/")
    }

}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.1-R0.1-SNAPSHOT")
    compileOnly("de.tr7zw:item-nbt-api-plugin:2.15.7")
    compileOnly("com.github.MilkBowl:VaultAPI:1.7.1") { exclude(group: "org.bukkit") }
    compileOnly("org.projectlombok:lombok:1.18.38")
    annotationProcessor("org.projectlombok:lombok:1.18.38")
    implementation("org.bstats:bstats-bukkit:3.2.1")
    implementation("dev.faststats.metrics:bukkit:0.29.0")
    implementation("com.google.code.gson:gson:2.14.0")
    implementation("com.zaxxer:HikariCP:7.0.2") {
        exclude(group: "org.slf4j", module: "slf4j-api")
    }
    implementation("com.h2database:h2:2.3.232")
    compileOnly("com.mysql:mysql-connector-j:8.4.0")
}

tasks {
    shadowJar {
        relocate("com.zaxxer.hikari", "org.maiminhdung.customenderchest.lib.hikari")
        relocate("org.h2", "org.maiminhdung.customenderchest.lib.h2")
        relocate("com.google.gson", "org.maiminhdung.customenderchest.lib.gson")
        relocate("org.bstats", "org.maiminhdung.customenderchest.lib.bstats")
        relocate("dev.faststats", "org.maiminhdung.customenderchest.lib.faststats")

        mergeServiceFiles()

        archiveBaseName.set("CustomEnderChest-NextGen")
        archiveClassifier.set(null)
        archiveVersion.set(project.version.toString())
    }

    build {
        dependsOn(tasks.shadowJar)
    }

    runServer {
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    doFirst {
        def configText = file('src/main/resources/config.yml').getText('UTF-8')
        def versionMatcher = configText =~ /(?m)^config-version:\s*["']?([^"'\s#]+)["']?\s*(?:#.*)?$/
        if (!versionMatcher.find()) {
            throw new GradleException('config.yml must contain config-version')
        }
        if (versionMatcher.group(1) != project.version.toString()) {
            throw new GradleException("config-version ${versionMatcher.group(1)} must match project version ${project.version}")
        }
    }
    filesMatching('plugin.yml') {
        expand props
    }
}
