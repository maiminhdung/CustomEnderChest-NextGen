name: CustomEnderChest
main: org.maiminhdung.customenderchest.EnderChest
version: "2.1.3-dev"
author: maiminhdung, brunyman
website: https://maiminhdung.dev/
load: STARTUP
api-version: 1.21
folia-supported: true
softdepend: [NBTAPI, Vault]
libraries:
  - com.mysql:mysql-connector-j:8.4.0
commands:
  customenderchest:
    description: Main command for CustomEnderChest.
    usage: "/<command> [open|reload|import vanilla|delete|migrate|stats]"
permissions:
  CustomEnderChest.level.0:
    description: 9 slots enderchest (1 raw).
    default: false
  CustomEnderChest.level.1:
    description: 18 slots enderchest (2 raws).
    default: false
  CustomEnderChest.level.2:
    description: 27 slots enderchest (3 raws).
    default: false
  CustomEnderChest.level.3:
    description: 36 slots enderchest (4 raws).
    default: false
  CustomEnderChest.level.4:
    description: 45 slots enderchest (5 raws).
    default: false
  CustomEnderChest.level.5:
    description: 54 slots enderchest (6 raws).
    default: false
  CustomEnderChest.command.open.self:
    description: Allows opening your own chest with the configured command.
    default: false
  CustomEnderChest.command.open.other:
    description: Allows opening other players' chests.
    default: op
  CustomEnderChest.command.delete:
    description: Allows deleting player data.
    default: op
  CustomEnderChest.admin:
    description: Administrative access for all commands.
    default: op
  CustomEnderChest.commands:
    description: Allows using the configured commands to open your enderchest.
    default: false
  CustomEnderChest.block.open:
    description: Allows opening your enderchest by right-clicking an Ender Chest block.
    default: false
  CustomEnderChest.command.overflow:
    description: Allows viewing and claiming your overflow items via the configured command.
    default: op
  CustomEnderChest.command.overflow.other:
    description: Allows viewing another player's overflow items via the configured command.
    default: op
