# -----------------------------------------------------------------------------
# CustomEnderChest configuration
# -----------------------------------------------------------------------------
# Messages and inventory titles are configured in the /lang directory.
# Run /<main-command> reload after changing settings marked [Reload].
# Restart the server after changing settings marked [Restart].
# Section headers marked [RELOAD] or [RESTART] apply to every key in that
# section.

# Internal schema version. Do not edit manually.
config-version: "2.2.0-dev"

# General settings
general:
  # [Reload] Language file code (Minecraft locale code): lang_<locale>.yml
  # Bundled: en_us, vi_vn, zh_cn, nl_nl, es_es
  locale: "en_us"

  # [Reload] Sends messages in each player's client language when a matching
  # language file exists (players with other clients see the locale above;
  # English is the final fallback). Also registers the translations with
  # Adventure's GlobalTranslator. Item GUIs render per player explicitly.
  player-locale: true

  # [Reload] Enables additional troubleshooting logs.
  debug: false

  # [Restart] Anonymous usage metrics sent to bStats.
  bstats-metrics: true

  # [Restart] Error reports and performance metrics sent to FastStats.
  faststats-metrics: true

  # [Restart] Checks Modrinth for plugin updates on startup.
  update-checker: true

  # [Restart] Update channel for the Modrinth check: release, beta or alpha.
  # "beta" also includes releases, "alpha" includes everything.
  update-channel: "release"

# [RELOAD] Command labels
commands:
  # [Reload] Primary command label, without the leading slash.
  main: "cec"

  # [Reload] Additional command labels. Use [] to disable aliases.
  aliases:
    - "ec"
    - "customenderchest"
    - "customec"

# [RELOAD] Player data backups
# Backups are stored in the plugin's /backups directory.
# MySQL backups contain connection/table information only; use mysqldump or your
# database provider's backup system for a complete MySQL backup.
backup:
  # [Reload] Enables scheduled backups.
  enabled: true

  # [Reload] Time between scheduled backups, in minutes.
  interval-minutes: 60

  # [Reload] Target maximum number of backup archives.
  # A backup is deleted only when it exceeds this count and is older than
  # retention-days.
  max-backups: 10

  # [Reload] Minimum age, in days, before an excess backup may be deleted.
  retention-days: 7

  # [Reload] Creates one final backup during a clean server shutdown.
  backup-on-shutdown: true

# [RESTART] Data storage
storage:
  # Available types:
  # yml   - One readable YAML file per player; suitable for small servers.
  # h2    - Local database; recommended for most single-server setups.
  # mysql - External database; recommended for multi-server networks.
  type: "h2"

  # SQL table name used by H2 and MySQL.
  # Allowed characters: letters, numbers, and underscores.
  table_name: "custom_enderchests"

  # Saves cached data for online players at this interval, in seconds.
  # Set to 0 to disable periodic auto-save. Players are still saved on close,
  # quit, and shutdown.
  auto-save-interval-seconds: 300

  # Used only when type is "mysql".
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "enderchest_db"
    username: "user"
    password: "password"
    use-ssl: false

  # Advanced worker/database pool settings.
  # max-pool-size also controls the number of asynchronous storage worker threads
  # for every storage type. Avoid increasing these values without measuring load.
  pool-settings:
    max-pool-size: 10
    min-idle: 5
    connection-timeout: 30000 # MySQL only, in milliseconds

  # Attempts to find data by player name when no data exists for the current UUID.
  # This is intended only for a controlled offline-mode -> online-mode migration.
  # SECURITY WARNING: On offline-mode servers, name-based migration can let an
  # attacker claim another player's data. Leave this disabled during normal use.
  migrate-uuid-by-name: false

# [RELOAD] Multi-Vault: multiple chests per player
# Vault 1 is the default Ender Chest (existing CustomEnderChest.level.* sizes
# still apply to it). Players unlock more vaults with:
#   CustomEnderChest.vaults.<number>  - access to vaults 1..<number>
#   CustomEnderChest.vaults.*         - access to every vault up to max-vaults
# Vault sizes for vault 2+ use CustomEnderChest.vault.<number>.level.<0-5>
# (or .level.* for 54 slots) and otherwise inherit the Vault 1 size.
# Operators always have every vault at maximum size.
multi-vault:
  # Enables the multi-vault system. When disabled, everyone only has the
  # single Ender Chest (Vault 1), exactly like previous plugin versions:
  # vault permissions are ignored, the selector GUI and vault arguments are
  # blocked. Stored vault 2+ data is kept and becomes accessible again when
  # this is re-enabled. The first-run setup GUI (/<main-command> setup)
  # writes this key when an admin makes their choice.
  enabled: true

  # Global cap on how many vaults a player can unlock through permissions.
  max-vaults: 9

  # Vault selector GUI opened with /<main-command> vaults (alias: menu).
  # Items, slots and decorations are configured in gui/selector.yml
  # (DeluxeMenu-style layout).
  selector-gui:
    # Enables the selector GUI and command.
    enabled: true

    # Also shows locked vaults as disabled entries.
    show-locked: true

    # Opens the selector when players right-click an Ender Chest block
    # (instead of opening Vault 1 directly). Disable to keep the classic
    # block-click behavior.
    open-on-block-click: true

    # Makes the bare /<main-command> command open the selector instead of
    # Vault 1 while multi-vault is enabled. /<main-command> open and
    # /<main-command> <number> always open vaults directly.
    use-as-main-command: true

# [RELOAD] Items that no longer fit after a player's chest size decreases
# Each vault keeps its own overflow storage.
overflow:
  expiration:
    # Permanently deletes unclaimed overflow items after the configured duration.
    enabled: false
    days: 30

    # Cleanup frequency in minutes. Values below 5 are treated as 5.
    check-interval-minutes: 60

  # Warns players on login when they have unclaimed overflow items.
  login-warning:
    enabled: true

  # Optional Vault economy charge when claiming overflow items.
  # If Vault or an economy provider is unavailable, no fee is charged.
  retrieval-fee:
    enabled: false
    flat-fee: 0
    per-item-fee: 0

# [RELOAD] Ender Chest block behavior
enderchest-options:
  # What happens when a player right-clicks an Ender Chest block:
  # custom     - Opens the custom chest for every eligible player.
  # permission - Opens the custom chest only for operators or players with
  #              CustomEnderChest.block.open. Others receive a denial message.
  # vanilla    - The plugin ignores the interaction and Minecraft opens the
  #              normal vanilla Ender Chest.
  block-interaction-mode: "custom"

  # Plays the physical block lid animation when opening the custom chest by block.
  # Disable this if you want only the custom open/close sounds below.
  play-block-animation: true

  # Silently cancels Ender Chest block interaction for vanished players
  # (EssentialsX vanish, Vanish metadata, and similar plugins), so vanished
  # staff never trigger chest opening, sounds, or animations.
  ignore-vanished-players: true

# [RELOAD] Defaults used when a player has no CustomEnderChest.level.<0-5> permission
default-player:
  # Gives players a chest without requiring a level permission.
  enabled: true

  # Number of slots: 9, 18, 27, 36, 45, or 54.
  size: 27

  # Allows players to use the primary command and aliases without the
  # CustomEnderChest.commands permission.
  allow-command: true

# [RELOAD] Sound settings
sounds:
  # Disables all sounds played directly by the plugin.
  disable-all: false

  # Sound names must match the Bukkit Sound enum:
  # https://jd.papermc.io/paper/1.21.1/org/bukkit/Sound.html
  open:
    name: "BLOCK_ENDER_CHEST_OPEN"
    volume: 1.0
    pitch: 1.0

  close:
    name: "BLOCK_ENDER_CHEST_CLOSE"
    volume: 1.0
    pitch: 1.0

  fail:
    name: "BLOCK_NOTE_BLOCK_PLING"
    volume: 1.0
    pitch: 0.5
