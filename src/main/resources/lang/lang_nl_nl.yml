# Prefix dat voor alle berichten wordt gebruikt
prefix: "<gray>[<gradient:#C0FFEE:#B4D0FF>EnderChest</gradient>]</gray> "

messages:
  no-permission: "<red>Je hebt daar geen toestemming voor.</red>"
  no-permission-block-open: "<red>You don't have permission to open the Ender Chest by clicking on it.</red>"
  players-only: "<red>Dit commando kan alleen door een speler worden uitgevoerd.</red>"
  reload-success: "<green>Configuratie-, taal- en opdrachtinstellingen zijn opnieuw geladen.</green>"
  reload-failed: "<red>Opnieuw laden is gedeeltelijk mislukt. Vorige waarden blijven actief voor mislukte onderdelen; controleer de console.</red>"
  data-still-loading: "<yellow>Je gegevens worden nog geladen, even geduld a.u.b...</yellow>"
  data-busy: "<red>Spelerdata is bezig. Probeer het binnenkort opnieuw.</red>"
  save-error: "<red>Er is een fout opgetreden tijdens het opslaan van gegevens. Controleer de console.</red>"
  invalid-player: "<red>Ongeldige spelersnaam.</red>"
  update-available: "<yellow>CustomEnderChest <white><latest></white> is available (you have <white><current></white>). Download: <gray><link>"
  vault-no-access: "<red>You don't have access to Vault <vault>."
  vault-invalid: "<red>Invalid vault number. Use 1 to <max>."

  # Migratie berichten
  migration-data-incompatible: "<yellow>Waarschuwing: je Ender Chest data is niet compatibel met de nieuwe serverversie (1.21.5+)."
  migration-data-cleared: "<yellow>Je Ender Chest is gereset vanwege incompatibiliteit. Oude gegevens zijn nog steeds bewaard in de database."
  migration-contact-admin: "<gray>Neem contact op met een admin als je de items wilt herstellen."
  data-migrated: "<green>Your enderchest data has been migrated to your new account."

  # Overflow berichten
  overflow-items-saved: "<yellow>⚠ Sommige items die buiten uw toestemming vallen, zijn opgeslagen in de overflow-opslag."
  overflow-will-restore: "<gray>Ze worden automatisch hersteld wanneer je je Ender Chest upgradet of <command> gebruikt."
  overflow-items-restored: "<green>✓ <count> Items uit de overflow-opslag hersteld!"
  overflow-login-warning: "<yellow>⚠ Je hebt <count> item(s) in overflow-opslag. Gebruik <command> om ze op te halen."
  overflow-login-warning-expiring: "<yellow>⚠ Je hebt <count> item(s) in overflow die over <days> dag(en) verlopen! Gebruik <command> om ze op te halen."
  overflow-expired: "<red>Je overflow items (<count> item(s)) zijn verlopen en verwijderd."
  overflow-fee-charged: "<yellow><amount> in rekening gebracht voor het ophalen van <count> overflow item(s)."
  overflow-fee-insufficient: "<red>Je hebt minstens <amount> nodig om je overflow items op te halen. Saldo: <balance>"
  overflow-fee-no-vault: "<red>Economie plugin (Vault) niet gevonden. Ophaal kosten uitgeschakeld."

command:
  usage: "<red>Gebruik: <gray>/<label> <usage>"
  player-not-found: "<red>Speler '<player>' niet gevonden of heeft geen gegevens."
  delete-usage: "<red>Gebruik: <gray>/<label> delete <player>"
  delete-success: "<green>Succesvol de Ender Chest van <white><player></white> verwijderd."
  delete-cancelled: "<red>Vault deletion was cancelled by another plugin."
  loading-chest: "<yellow>Ender Chest van <white><player></white> wordt geladen..."
  import-usage: "<red>Usage: <gray>/<label> import <vanilla>"
  import-invalid-type: "<red>Invalid import type. Use: <gray>vanilla"
  migrate-usage: "<yellow>Usage: <gray>/<label> migrate <yml|h2|mysql> <yml|h2|mysql>"
  migrate-example: "<gray>Example: /<label> migrate yml mysql"
  migrate-running: "<red>Another migration process is currently running. Please wait!"
  migrate-same-type: "<red>Source and target formats cannot be the same."
  migrate-init: "<yellow>Initializing database connection..."
  migrate-conn-source-err: "<red>Error connecting to source format. Migration cancelled."
  migrate-conn-target-err: "<red>Error connecting to target format. Migration cancelled."
  migrate-start: "<yellow>Starting data migration from <source> to <target>..."
  migrate-no-data: "<red>No data found to migrate."
  migrate-success: "<green>Data migration complete! Success: <success>/<total>, Failed: <failed>"
  migrate-note: "<yellow>⚠ Note: <white>To use the migrated data, stop the server, update the storage type in config.yml, then start the server again."
  migrate-error-unknown: "<red>An unknown error occurred during migration. Check Console for details."
  migrate-in-progress: "<red>System is undergoing data maintenance (migration), you cannot open the chest right now!"
  overflow-title: "<dark_purple><player>'s Overflow <dark_gray>[Vault <vault>]"
  overflow-admin-title: "<dark_red>Admin Overflow: <white><player></white> <dark_gray>[Vault <vault>]"
  overflow-all-title: "<dark_purple><player>'s Overflow <dark_gray>[All Vaults]"
  overflow-empty: "<green>Je hebt geen items in de overflow-opslag."
  overflow-admin-empty: "<green><player> heeft geen items in de overflow-opslag."
  overflow-no-enderchest: "<red>Je hebt een Ender Chest nodig om overflow items op te halen."
  overflow-claimed: "<green>✓ <count> item(s) uit overflow opgehaald!"
  overflow-enderchest-full: "<yellow>Je inventaris is vol. Resterende items blijven in de overflow-opslag."
  overflow-claim-failed: "<red>Ophalen van overflow items mislukt. Probeer het opnieuw."

titles:
  enderchest: "<level> - <light_purple><player>'s Kist"
  admin_view: "<dark_red>Admin Overzicht: <white><player>"
  enderchest-vault: "<level> - <light_purple><player>'s Vault <vault>"
  admin_view_vault: "<dark_red>Admin View: <white><player></white> [Vault <vault>]"

levels:
  '0': "<white>Level 1" # 1 rij (9 slots)
  '1': "<green>Level 2" # 2 rij (18 slots)
  '2': "<aqua>Level 3" # 3 rij (27 slots)
  '3': "<yellow>Level 4" # 4 rij (36 slots)
  '4': "<gold>Level 5" # 5 rij (45 slots)
  '5': "<light_purple><bold>Level 6" # 6 rij (54 slots)

import:
  started: "<green>Starting vanilla ender chest import for all online players..."
  complete: "<green>Import complete! <white><imported></white> players imported, <white><skipped></white> skipped."
  nbtapi-missing: "<red>NBTAPI plugin is vereist voor dit commando. Installeer NBTAPI op je server."
stats:
  help-header: "<yellow>Stats commands:"
  help-summary: "<gray><command> <white>- Show storage statistics summary"
  help-validate: "<gray><command> <white>- Validate stored player data"
  collecting: "<yellow>Collecting storage statistics..."
  validating: "<yellow>Validating stored data..."
  header: "<yellow>==================== Stats ====================="
  validation-header: "<yellow>================== Validation =================="
  footer: "<yellow>================================================="
  storage-type: "<yellow>Storage type: <white><value>"
  total-records: "<yellow>Total player records: <white><value>"
  records-with-items: "<yellow>Players with items: <white><value>"
  total-items: "<yellow>Total stored items: <white><value>"
  overflow-players: "<yellow>Overflow players: <white><value>"
  overflow-items: "<yellow>Overflow items: <white><value>"
  data-size: "<yellow>Data size (bytes): <white><value>"
  validation-total-records: "<yellow>Total records: <white><value>"
  validation-records-with-items: "<yellow>Records with items: <white><value>"
  validation-records-with-overflow: "<yellow>Records with overflow: <white><value>"
  validation-corrupted: "<yellow>Corrupted records: <white><value>"
  vault-records: "<yellow>Vaults with data: <white><value>"
  corrupted-list-header: "<red>Corrupted entries (max 10 shown):"
  corrupted-entry: "<red>- <player> (<uuid>): <error>"
  corrupted-more: "<red>... and <count> more corrupted entries."

vault-selector:
  locked-message: "<red>You don't have access to Vault <vault>."
  disabled: "<red>The vault selector GUI is disabled on this server."
  items-unknown: "?"

setup:
  applied: "<green>Mode selected: <white><mode></white>."
  reminder: "<yellow>Tip: check <white>config.yml</white> to fine-tune sizes, permissions and the selector GUI."

gui:
  setup:
    title: "<dark_aqua>▶ <black>Ender Chest Setup <dark_gray>[<dark_aqua>/cec setup<dark_gray>]"
    single-name: "<green><bold>SINGLE ENDER CHEST <dark_gray>(classic)"
    single-lore: "
<white>General information:

<gray>One chest per player, like vanilla</gray>
<gray>and previous versions of this plugin.</gray>

<gray>Size by</gray> <gold>CustomEnderChest.level.<0-5></gold>
<gray>Fallback:</gray> <gold>default-player.size</gold>

<yellow>▶ Click to choose this mode</yellow>
<gray>Switch to Multi-Vault anytime via</gray>
<gray><gold>multi-vault.enabled</gold> <gray>in config.yml.</gray>"
    multi-name: "<light_purple><bold>MULTI-VAULT <dark_gray>(multiple chests)"
    multi-lore: "
<white>General information:

<gray>Each player owns multiple chests</gray>
<gray>(vaults) unlocked by permissions.</gray>

<gray>Unlock vaults:</gray> <gold>CustomEnderChest.vaults.<n></gold>
<gray>Vault 1 size:</gray> <gold>CustomEnderChest.level.<0-5></gold>
<gray>Vault n size:</gray> <gold>CustomEnderChest.vault.<n>.level.<0-5></gold>
<gray>Selector GUI, per-vault overflow,</gray>
<gray>admin access to every vault.</gray>

<yellow>▶ Click to choose this mode</yellow>
<gray>Existing data becomes Vault 1.</gray>"
    guide-name: "<aqua><bold>HOW IT WORKS <dark_gray>(info)"
    guide-lore: "
<gray>Both modes share the same storage</gray>
<gray>backend; player data is safe either way.</gray>

<white>Single:</white> <gray>one chest, 27 slots by</gray>
<gray>default, expandable to 54.</gray>

<white>Multi-Vault:</white> <gray>up to</gray> <gold>multi-vault.max-vaults</gold>
<gray>chests per player, each with</gray>
<gray>its own size.</gray>

<yellow>▶ Click an option to choose</yellow>"
    close-name: "<red><bold>CLOSE <dark_gray>(decide later)"
    close-lore: "
<gray>Close this GUI without choosing.</gray>
<gray>It reappears on the next admin join,</gray>
<gray>or run</gray> <gold>/cec setup</gold><gray>.</gray>"
  selector:
    title: "<dark_aqua>▶ <black>Your Vaults <dark_gray>[<dark_aqua>/cec vaults<dark_gray>]"
    vault-name: "<light_purple><bold>VAULT <vault> <dark_gray>(<size> slots)"
    vault-lore: "
<white>Vault informations:

<gray>Items stored:</gray> <yellow><items></yellow>
<gray>Size:</gray> <yellow><size> slots</yellow>

<yellow>▶ Click to open this vault</yellow>"
    locked-name: "<gray><bold>VAULT <vault> <dark_gray>(locked)"
    locked-lore: "
<white>Vault informations:

<gray>Size:</gray> <yellow>???</yellow>

<red>✘ You don't have permission</red>
<red>to use this vault.</red>"
    close-name: "<red><bold>CLOSE"
    close-lore: "
<gray>Close this menu.</gray>"
